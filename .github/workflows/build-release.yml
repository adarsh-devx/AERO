name: Build & Release Aero APK

on:
  push:
    branches:
      - master
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    name: Build Android Release APK
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: ☕ Setup Java 17 (JDK)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 17

      - name: 📦 Install Node Dependencies
        run: npm install

      - name: 🔍 TypeScript Type Check
        run: npx tsc --noEmit

      - name: 🐘 Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: ⚙️ Make Gradlew Executable
        run: chmod +x android/gradlew

      - name: 🚀 Build Standalone Release APK
        working-directory: android
        env:
          EXPO_PUBLIC_YOUTUBE_API_KEY: ${{ secrets.EXPO_PUBLIC_YOUTUBE_API_KEY }}
        run: ./gradlew assembleRelease --no-daemon

      - name: 🏷️ Rename APKs with Aero Branding
        run: |
          cd android/app/build/outputs/apk/release
          for f in app-*-release.apk; do
            if [ -f "$f" ]; then
              abi=$(echo "$f" | sed -E 's/app-(.+)-release\.apk/\1/')
              mv "$f" "Aero-v1.0.0-${abi}.apk"
            fi
          done
          ls -la

      - name: 📤 Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Aero-Music-Release-APK
          path: android/app/build/outputs/apk/release/Aero-*.apk
          retention-days: 30

      - name: 🚀 Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: "Aero v1.0.0 - Liquid Glass Music Player"
          files: android/app/build/outputs/apk/release/Aero-*.apk
          generate_release_notes: true
          prerelease: false
