name: Build & Release Aero APK

on:
  push:
    branches:
      - master
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    name: Build Android Release APK
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: ☕ Setup Java 17 (JDK)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 17

      - name: 📦 Install Node Dependencies
        run: npm install

      - name: 🔍 TypeScript Type Check
        run: npx tsc --noEmit

      - name: 🐘 Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: ⚙️ Make Gradlew Executable
        run: chmod +x android/gradlew

      # Release keystore (Meld-style env-only signing): restored from a base64
      # secret when the maintainer has configured it, otherwise the build falls
      # back to debug-keystore signing (pre-existing behaviour). No credential
      # ever lives in this repository - see android/app/build.gradle.
      - name: 🛡️ Restore Release Keystore (skipped when secret absent)
        env:
          AERO_RELEASE_KEYSTORE_BASE64: ${{ secrets.AERO_RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$AERO_RELEASE_KEYSTORE_BASE64" ]; then
            mkdir -p android/app/keystore
            printf '%s' "$AERO_RELEASE_KEYSTORE_BASE64" | base64 -d > android/app/keystore/release.keystore
            echo "AERO_RELEASE_KEYSTORE_PATH=$PWD/android/app/keystore/release.keystore" >> "$GITHUB_ENV"
            echo "Release keystore restored - APK will be production-signed."
          else
            echo "No AERO_RELEASE_KEYSTORE_BASE64 secret - building signed with the debug keystore (pre-existing behaviour)."
          fi

      # In-app update support: the APK's versionName must equal the release
      # tag's version and versionCode must be monotonically increasing,
      # otherwise a downloaded update would reinstall the same identity and
      # the update checker would loop forever ("newer release" on every
      # launch). Tag builds stamp both from the vX.Y.Z tag with verification
      # (a failed stamp must fail the build, never ship silently); branch
      # builds keep the repository defaults (1.0.0 / 1).
      - name: 🏷️ Stamp App Version from Tag
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VER="${GITHUB_REF_NAME#v}"
            if [[ ! "$VER" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "Unsupported release tag '$GITHUB_REF_NAME' - expected vX.Y.Z"
              exit 1
            fi
            IFS='.' read -r MAJOR MINOR PATCH <<< "$VER"
            CODE=$(( MAJOR * 1000000 + MINOR * 1000 + PATCH ))
            sed -i -E "s/^([[:space:]]*)versionCode 1$/\1versionCode $CODE/" android/app/build.gradle
            sed -i -E "s/^([[:space:]]*)versionName \"1\.0\.0\"$/\1versionName \"$VER\"/" android/app/build.gradle
            grep -qE "^[[:space:]]*versionCode $CODE\$" android/app/build.gradle || { echo "::error::versionCode stamp failed"; exit 1; }
            grep -qF "versionName \"$VER\"" android/app/build.gradle || { echo "::error::versionName stamp failed"; exit 1; }
            echo "AERO_VERSION=$VER" >> "$GITHUB_ENV"
            echo "Stamped versionName=$VER versionCode=$CODE"
          else
            echo "AERO_VERSION=1.0.0" >> "$GITHUB_ENV"
            echo "Branch build - keeping repository defaults (1.0.0 / 1)."
          fi

      - name: 🚀 Build Standalone Release APK
        working-directory: android
        env:
          AERO_RELEASE_KEYSTORE_PASSWORD: ${{ secrets.AERO_RELEASE_KEYSTORE_PASSWORD }}
          AERO_RELEASE_KEY_ALIAS: ${{ secrets.AERO_RELEASE_KEY_ALIAS }}
          AERO_RELEASE_KEY_PASSWORD: ${{ secrets.AERO_RELEASE_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon

      - name: 🏷️ Prepare Release APKs with Aero Branding
        run: |
          OUTPUT_DIR="android/app/build/outputs/apk/release"
          if [ -d "$OUTPUT_DIR" ]; then
            cd "$OUTPUT_DIR"
            for f in *.apk; do
              if [ -f "$f" ] && [[ "$f" != Aero-* ]]; then
                clean_name=$(echo "$f" | sed -E "s/^app-(.+)-release\.apk/Aero-v${AERO_VERSION}-\1.apk/" | sed -E "s/^app-release\.apk/Aero-v${AERO_VERSION}-universal.apk/")
                mv "$f" "$clean_name" || true
              fi
            done
            ls -la
          fi

      - name: 📤 Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Aero-Music-Release-APK
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: 🚀 Publish GitHub Release (On Tag Push)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: "Aero v${{ env.AERO_VERSION }} - Liquid Glass Music Player"
          files: android/app/build/outputs/apk/release/*.apk
          generate_release_notes: true
          prerelease: false
