name: Build & Release Aero APK

on:
  push:
    branches:
      - master
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    name: Build Android Release APK
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: ☕ Setup Java 17 (JDK)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 17

      - name: 📦 Install Node Dependencies
        run: npm install

      - name: 🔍 TypeScript Type Check
        run: npx tsc --noEmit

      - name: 🐘 Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: ⚙️ Make Gradlew Executable
        run: chmod +x android/gradlew

      - name: 🚀 Build Standalone Release APK
        working-directory: android
        env:
          EXPO_PUBLIC_YOUTUBE_API_KEY: ${{ secrets.EXPO_PUBLIC_YOUTUBE_API_KEY }}
        run: ./gradlew assembleRelease --no-daemon

      - name: 🏷️ Prepare Release APKs with Aero Branding
        run: |
          OUTPUT_DIR="android/app/build/outputs/apk/release"
          if [ -d "$OUTPUT_DIR" ]; then
            cd "$OUTPUT_DIR"
            for f in *.apk; do
              if [ -f "$f" ] && [[ "$f" != Aero-* ]]; then
                clean_name=$(echo "$f" | sed -E 's/^app-(.+)-release\.apk/Aero-v1.0.0-\1.apk/' | sed -E 's/^app-release\.apk/Aero-v1.0.0-universal.apk/')
                mv "$f" "$clean_name" || true
              fi
            done
            ls -la
          fi

      - name: 📤 Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Aero-Music-Release-APK
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: 🚀 Publish GitHub Release (On Tag Push)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: "Aero v1.0.0 - Liquid Glass Music Player"
          files: android/app/build/outputs/apk/release/*.apk
          generate_release_notes: true
          prerelease: false
