plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group 'host.exp.exponent'
version '1.0.0'

android {
  namespace "expo.modules.mediacontrols"
  defaultConfig {
    versionCode 1
    versionName '1.0.0'
  }
}

dependencies {
  // NotificationCompat + ContextCompat receiver registration.
  implementation 'androidx.core:core-ktx:1.15.0'
  // MediaSessionCompat + MediaStyle notification (same artifacts
  // expo-audio/media3 already resolve, so builds stay offline-safe).
  implementation 'androidx.media:media:1.7.0'
}
